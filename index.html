<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conference on Networks in Economics: production networks, firm linkages, and their macroeconomic implications.">
    <title>Networks / Economics — Production Networks Conference</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #071a2b;
            --ink-soft: #0d2b45;
            --paper: #f4f7f8;
            --paper-deep: #e5ecef;
            --white: #fbfdff;
            --muted: #6b7b87;
            --line: rgba(7, 26, 43, 0.13);
            --line-light: rgba(255, 255, 255, 0.14);
            --accent: #39d0c3;
            --accent-deep: #087f8f;
            --signal: #f2a65a;
            --mono: "DM Mono", "SFMono-Regular", Consolas, monospace;
            --sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 1.125rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        button, a { font: inherit; }

        a { color: inherit; text-decoration: none; }

        button { border: 0; cursor: pointer; }

        .container {
            width: min(1180px, calc(100% - 48px));
            margin: 0 auto;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(244, 247, 248, 0.9);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(16px);
        }

        .nav {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--ink);
            font-size: 0.9375rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            line-height: 1;
            text-transform: uppercase;
        }

        .brand small {
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.08em;
        }

        .brand-symbol {
            position: relative;
            width: 28px;
            height: 28px;
            display: inline-grid;
            place-items: center;
            background: var(--accent);
            border-radius: 50%;
            color: var(--ink);
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0;
        }

        .brand-symbol::after {
            content: "";
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(7, 26, 43, 0.35);
            border-radius: 50%;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            color: #5f707c;
            font-family: var(--mono);
            font-size: 0.875rem;
            text-transform: uppercase;
        }

        .nav-links a { transition: color 180ms ease; }
        .nav-links a:hover { color: var(--accent-deep); }

        .nav-cta, .button-primary {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--ink);
            color: var(--white);
            font-size: 0.9375rem;
            font-weight: 700;
            padding: 12px 16px;
            border-radius: 999px;
            transition: background 180ms ease, transform 180ms ease;
        }

        .nav-cta:hover, .button-primary:hover {
            background: var(--accent-deep);
            transform: translateY(-2px);
        }

        .nav-cta {
            background: transparent;
            color: var(--ink);
            padding: 0;
            border-radius: 0;
        }

        .nav-cta:hover {
            background: transparent;
            color: var(--accent-deep);
            transform: none;
        }

        .arrow { font-size: 16px; font-weight: 400; line-height: 0; }

        .hero {
            position: relative;
            min-height: 560px;
            display: flex;
            align-items: center;
            overflow: hidden;
            background: var(--ink);
            color: var(--white);
            border-radius: 0 0 30px 30px;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 78% 40%, rgba(57, 208, 195, 0.15), transparent 28%),
                linear-gradient(118deg, rgba(7, 26, 43, 0.94), rgba(7, 26, 43, 0.7));
            pointer-events: none;
        }

        .network-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0.3;
        }

        .hero-inner {
            position: relative;
            z-index: 1;
            width: min(1180px, calc(100% - 48px));
            margin: 0 auto;
            display: block;
            padding: 108px 0 84px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
            font-family: var(--mono);
            font-size: 0.875rem;
            letter-spacing: 0.12em;
            line-height: 1.4;
            text-transform: uppercase;
        }

        .eyebrow.light { color: var(--signal); }

        .status-pulse, .live-dot {
            width: 7px;
            height: 7px;
            display: inline-block;
            background: currentColor;
            border-radius: 50%;
            box-shadow: 0 0 0 5px rgba(242, 166, 90, 0.12);
        }

        .hero h1 {
            max-width: 760px;
            margin: 24px 0 24px;
            font-size: clamp(48px, 6.5vw, 80px);
            font-weight: 500;
            letter-spacing: -0.075em;
            line-height: 1;
        }

        .hero h1 span { color: var(--accent); }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 36px;
        }

        .button-primary { background: var(--accent); color: var(--ink); }
        .button-primary:hover { background: var(--signal); color: var(--ink); }

        .section { padding: 100px 0; }

        .section-label, .card-index, .edition-label, .program-label {
            color: var(--accent-deep);
            font-family: var(--mono);
            font-size: 0.8125rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .edition-section { padding-top: 128px; }

        .edition-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 40px;
            margin-bottom: 56px;
        }

        .edition-heading h2 { margin: 0; font-size: clamp(30px, 4vw, 48px); font-weight: 500; letter-spacing: -0.06em; }

        .year-switcher {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 0;
            border-bottom: 1px solid var(--line);
            border-radius: 0;
        }

        .year-btn {
            min-width: 0;
            display: inline-flex;
            align-items: baseline;
            gap: 8px;
            padding: 9px 0 10px;
            border-radius: 0;
            background: transparent;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 1rem;
            transition: color 180ms ease, border-color 180ms ease;
        }

        .year-btn:hover { color: var(--ink); }
        .year-btn.active { background: transparent; color: var(--ink); border-bottom: 2px solid var(--accent); margin-bottom: -1px; }
        .year-state { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
        .year-btn.active .year-state { color: var(--accent-deep); }

        .edition-shell {
            border-top: 1px solid var(--ink);
        }

        .edition-overview {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(280px, 0.7fr);
            gap: 70px;
            padding: 48px 0 68px;
        }

        .edition-overview h3 {
            max-width: 740px;
            margin: 18px 0 18px;
            font-size: clamp(32px, 5vw, 58px);
            font-weight: 500;
            letter-spacing: -0.065em;
            line-height: 1;
        }

        .edition-description {
            max-width: 630px;
            margin: 0;
            color: #60727f;
            font-size: 1.125rem;
            line-height: 1.7;
        }

        .edition-status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 0 0 8px;
            border-bottom: 1px solid var(--accent);
            border-radius: 0;
            background: transparent;
            color: var(--accent-deep);
            font-family: var(--mono);
            font-size: 0.875rem;
            text-transform: uppercase;
        }

        .edition-status.archive { background: transparent; color: #616960; border-color: var(--line); }

        .event-facts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            align-content: start;
        }

        .fact {
            padding-top: 13px;
            border-top: 1px solid var(--line);
        }

        .fact-label {
            display: block;
            margin-bottom: 9px;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.8125rem;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        .fact-value { color: var(--ink); font-size: 1.0625rem; line-height: 1.5; }

        .organizer-list { margin-top: 30px; }

        .organizer-list .fact-label { margin-bottom: 12px; }

        .organizer-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
        }

        .organizer-item {
            color: #526774;
            font-size: 1rem;
        }

        .organizer-item span { color: var(--accent-deep); }

        .venue-block {
            margin: 90px 0 78px;
            padding-top: 24px;
            border-top: 1px solid var(--ink);
        }

        .venue-header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 40px;
            margin-bottom: 24px;
        }

        .venue-header h4 {
            max-width: 760px;
            margin: 12px 0 0;
            font-size: clamp(27px, 4vw, 44px);
            font-weight: 500;
            letter-spacing: -0.055em;
            line-height: 1.05;
        }

        .venue-meta {
            display: grid;
            gap: 7px;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.8125rem;
            letter-spacing: 0.08em;
            text-align: right;
            text-transform: uppercase;
        }

        .location-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.65fr) minmax(280px, 0.7fr);
            gap: 12px;
        }

        .location-grid.single { grid-template-columns: 1fr; }

        .location-card {
            min-width: 0;
            margin: 0;
            overflow: hidden;
            background: var(--paper-deep);
        }

        .location-card img {
            width: 100%;
            height: 430px;
            display: block;
            object-fit: cover;
        }

        .photo-credit {
            padding-top: 9px;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.75rem;
            line-height: 1.5;
        }

        .photo-credit a { border-bottom: 1px solid var(--line); }
        .photo-credit a:hover { color: var(--accent-deep); }

        .map-card {
            position: relative;
            min-height: 430px;
            overflow: hidden;
            background: var(--paper-deep);
            border: 1px solid var(--line);
        }

        .map-card::after {
            content: "Map";
            position: absolute;
            top: 14px;
            right: 14px;
            padding: 6px 8px;
            background: var(--ink);
            color: var(--white);
            font-family: var(--mono);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            pointer-events: none;
        }

        .map-card iframe { width: 100%; height: 100%; min-height: 430px; border: 0; filter: grayscale(0.2) saturate(0.72) contrast(0.98); }

        .program-block {
            padding: 70px 0 0;
            border-top: 1px solid var(--line);
        }

        .program-heading {
            display: flex;
            justify-content: space-between;
            gap: 32px;
            align-items: end;
            margin-bottom: 44px;
        }

        .program-heading h4 { margin: 14px 0 0; font-size: 2.5rem; font-weight: 500; letter-spacing: -0.06em; }
        .program-heading p { max-width: 400px; margin: 0; color: var(--muted); font-size: 1.125rem; line-height: 1.6; }

        .program-day { margin-top: 42px; }

        .day-heading {
            display: flex;
            align-items: baseline;
            gap: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--ink);
        }

        .day-heading span { color: var(--accent-deep); font-family: var(--mono); font-size: 0.875rem; }
        .day-heading h5 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }

        .session {
            display: grid;
            grid-template-columns: 148px minmax(0, 1fr) 30px;
            gap: 32px;
            align-items: start;
            padding: 32px 0;
            border-bottom: 1px solid var(--line);
            transition: padding 180ms ease, background 180ms ease;
        }

        .session:hover { padding-left: 14px; padding-right: 14px; background: rgba(255, 255, 255, 0.56); }

        .session-time { color: var(--accent-deep); font-family: var(--mono); font-size: 1.125rem; line-height: 1.4; }
        .session-time small { color: var(--muted); font-size: 0.875rem; }
        .session-body h6 { margin: 0 0 14px; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.025em; }
        .session-body p { margin: 7px 0 0; color: #697b87; font-size: 1.0625rem; line-height: 1.55; }
        .session-body p span { margin-right: 8px; color: var(--muted); font-family: var(--mono); font-size: 0.8125rem; letter-spacing: 0.08em; text-transform: uppercase; }
        .session-arrow { color: var(--muted); font-size: 17px; opacity: 0; transition: opacity 180ms ease, color 180ms ease; }
        .session:hover .session-arrow { color: var(--accent-deep); opacity: 1; }

        .session-admin { grid-template-columns: 148px minmax(0, 1fr); }
        .session-admin .session-body h6 { color: #6d7d88; font-size: 1.25rem; font-weight: 500; }
        .session-admin .session-arrow { display: none; }

        .empty-program {
            padding: 28px 0;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 1rem;
        }

        .people-section {
            padding: 90px 0 0;
            border-top: 1px solid var(--line);
        }

        .people-heading { display: flex; align-items: end; justify-content: space-between; gap: 28px; }
        .people-heading h4 { margin: 14px 0 0; font-size: 2.5rem; font-weight: 500; letter-spacing: -0.06em; }
        .people-heading p { max-width: 380px; margin: 0; color: var(--muted); font-size: 1.125rem; line-height: 1.6; }

        .people-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 40px;
            background: transparent;
        }

        .person {
            min-height: 92px;
            padding: 16px;
            background: var(--paper);
            border: 1px solid var(--line);
        }

        .person-name { font-size: 1.125rem; line-height: 1.4; }
        .person-inst { margin-top: 7px; color: var(--accent-deep); font-family: var(--mono); font-size: 0.875rem; line-height: 1.5; }

        footer { padding: 28px 0; background: var(--ink); color: rgba(251, 251, 248, 0.42); border-top: 1px solid var(--line-light); }
        .footer-inner { display: flex; justify-content: space-between; gap: 24px; font-family: var(--mono); font-size: 0.8125rem; text-transform: uppercase; }

        @media (max-width: 900px) {
            .edition-overview { grid-template-columns: 1fr; gap: 52px; }
            .location-card img, .map-card, .map-card iframe { height: 360px; min-height: 360px; }
            .people-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 640px) {
            .container, .hero-inner { width: min(100% - 32px, 1180px); }
            .nav { min-height: 68px; }
            .nav-links { display: none; }
            .nav-cta { font-size: 0.875rem; }
            .hero { min-height: 600px; border-radius: 0 0 20px 20px; }
            .hero-inner { padding: 78px 0 58px; }
            .hero h1 { font-size: clamp(46px, 13vw, 72px); }
            .hero-actions { align-items: flex-start; flex-direction: column; gap: 18px; }
            .section { padding: 82px 0; }
            .edition-section { padding-top: 84px; }
            .edition-heading, .program-heading, .people-heading { align-items: flex-start; flex-direction: column; gap: 26px; }
            .edition-overview { padding-top: 34px; }
            .event-facts, .location-grid { grid-template-columns: 1fr; }
            .venue-block { margin: 72px 0 58px; }
            .venue-header { align-items: flex-start; flex-direction: column; gap: 14px; }
            .venue-meta { text-align: left; }
            .location-card img, .map-card, .map-card iframe { height: 300px; min-height: 300px; }
            .session, .session-admin { grid-template-columns: 104px minmax(0, 1fr); gap: 18px; }
            .session-arrow { display: none; }
            .people-grid { grid-template-columns: repeat(2, 1fr); }
            .footer-inner { align-items: flex-start; flex-direction: column; }
        }

        @media (max-width: 460px) {
            .session, .session-admin { grid-template-columns: 1fr; gap: 12px; }
            .session-time { font-size: 1rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container nav">
            <a class="brand" href="#top" aria-label="Networks Economics home">
                <span class="brand-symbol">↗</span>
                <span>Networks <small>in Economics</small></span>
            </a>
            <nav class="nav-links" aria-label="Primary navigation">
                <a href="#editions">Editions</a>
            </nav>
            <a class="nav-cta" href="#editions">2026 <span class="arrow">↘</span></a>
        </div>
    </header>

    <main id="top">
        <section class="hero" aria-labelledby="hero-title">
            <canvas id="network-canvas" class="network-canvas" aria-hidden="true"></canvas>
            <div class="hero-inner">
                <div>
                    <div class="eyebrow light"><span class="status-pulse"></span> October 23–24, 2026 · Honolulu, Hawaiʻi</div>
                    <h1 id="hero-title">Conference on <span>Networks</span> in Economics</h1>
                    <div class="hero-actions">
                        <a class="button-primary" href="#editions">View program <span class="arrow">↘</span></a>
                    </div>
                </div>
            </div>
        </section>

        <section class="section edition-section" id="editions">
            <div class="container">
                <div class="edition-heading">
                    <h2>Conference editions</h2>
                    <div class="year-switcher" role="tablist" aria-label="Conference editions">
                        <button class="year-btn active" id="btn-2026" type="button" role="tab" aria-selected="true" aria-controls="edition-content" data-year="2026"><span>2026</span><span class="year-state">Upcoming</span></button>
                        <button class="year-btn" id="btn-2023" type="button" role="tab" aria-selected="false" aria-controls="edition-content" data-year="2023"><span>2023</span><span class="year-state">Archive</span></button>
                    </div>
                </div>

                <div id="edition-content" aria-live="polite"></div>
            </div>
        </section>

    </main>

    <footer>
        <div class="container footer-inner">
            <span>Conference on Networks in Economics</span>
            <span>© 2026 · Theory and evidence</span>
        </div>
    </footer>

        const editions = {
            "2026": {

                location: "University of Hawaiʻi at Mānoa, Honolulu, HI",

                status: "upcoming",
                description: "Production networks, firm dynamics, and macroeconomic outcomes.",
                participants: roster2026,
                organizers: [
                    { name: "Jorge Miranda-Pinto", inst: "IMF" },
                    { name: "James Morley", inst: "University of Sydney" },

        function splitTime(time) {
            const parts = time.split(" ");
            return `${parts[0]} <small>${parts[1] || ""}</small>`;
        }

        function renderSession(session) {
            if (session.type === "admin") {
                return `
                    <div class="session session-admin">
                        <div class="session-time">${splitTime(session.time)}</div>
                        <div class="session-body"><h6>${session.title}</h6></div>
                    </div>
                `;
            }

            return `
                <article class="session">
                    <div class="session-time">${splitTime(session.time)}</div>
                    <div class="session-body">
                        <h6>${session.title}</h6>
                        <p><span>Presenter:</span>${session.author}, ${session.inst}</p>
                        ${session.discussant ? `<p><span>Discussant:</span>${session.discussant}, ${session.discussantInst}</p>` : ""}
                    </div>
                    <div class="session-arrow">↗</div>
                </article>
            `;
        }

        function renderEdition(year) {
            const edition = editions[year];
            const statusLabel = edition.status === "upcoming" ? "Upcoming edition" : "Archive";
            const statusClass = edition.status === "upcoming" ? "" : " archive";
            const organizers = edition.organizers ? `
                <div class="organizer-list">
                    <span class="fact-label">Organizing committee</span>
                    <div class="organizer-items">
                        ${edition.organizers.map(person => `<div class="organizer-item">${person.name} <span>· ${person.inst}</span></div>`).join("")}
                    </div>
                </div>
            ` : "";
            const photoCredit = edition.photoCredit ? `
                <figcaption class="photo-credit">
                    Photo: <a href="${edition.photoCredit.source}" target="_blank" rel="noreferrer">${edition.photoCredit.author}</a>
                    · <a href="${edition.photoCredit.licenseUrl}" target="_blank" rel="noreferrer">${edition.photoCredit.license}</a>
                </figcaption>
            ` : "";
            const location = edition.locationImage || edition.mapUrl ? `
                <section class="venue-block" aria-labelledby="venue-title-${edition.year}">
                    <div class="venue-header">
                        <div>
                            <div class="program-label">Location</div>
                            <h4 id="venue-title-${edition.year}">${edition.venue || edition.location}</h4>
                        </div>
                        <div class="venue-meta">
                            <span>${edition.city || edition.location}</span>
                            ${edition.coordinates ? `<span>${edition.coordinates}</span>` : ""}
                        </div>
                    </div>
                    <div class="location-grid${edition.mapUrl ? "" : " single"}">
                        ${edition.locationImage ? `<figure class="location-card"><img src="${edition.locationImage}" alt="${edition.locationImageAlt || edition.location}" loading="lazy">${photoCredit}</figure>` : ""}
                        ${edition.mapUrl ? `<div class="map-card"><iframe src="${edition.mapUrl}" title="Map of ${edition.location}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>` : ""}
                    </div>
                </section>
            ` : "";
            const program = edition.agenda.map((day, index) => `
                <div class="program-day">
                    <div class="day-heading"><span>0${index + 1}</span><h5>${day.day}</h5></div>
                    ${day.sessions.length ? day.sessions.map(renderSession).join("") : '<div class="empty-program">Program details to follow.</div>'}
                </div>
            `).join("");

            return `
                <div class="edition-shell">
                    <div class="edition-overview">
                        <div>
                            <div class="edition-status${statusClass}"><span class="status-pulse"></span> ${statusLabel}</div>
                            <h3>${edition.theme}</h3>
                            <p class="edition-description">${edition.description}</p>
                            ${organizers}
                        </div>
                        <div class="event-facts">
                            <div class="fact"><span class="fact-label">When</span><div class="fact-value">${edition.dates}</div></div>
                            <div class="fact"><span class="fact-label">Where</span><div class="fact-value">${edition.location}</div></div>
                        </div>
                    </div>

                    <section class="program-block" id="program" aria-labelledby="program-title">
                        <div class="program-heading">
                            <div><div class="program-label">Program</div><h4 id="program-title">Schedule</h4></div>
                        </div>
                        ${program}
                    </section>

                    ${location}

                    <section class="people-section" aria-labelledby="people-title">
                        <div class="people-heading">
                            <div><div class="program-label">${edition.year}</div><h4 id="people-title">Participants</h4></div>
                        </div>
                        <div class="people-grid">
                            ${edition.participants.map(person => `
                                <div class="person">
                                    <div>
                                        <div class="person-name">${person.name}</div>
                                        <div class="person-inst">${person.inst}</div>
                                    </div>
                                </div>
                            `).join("")}
                        </div>
                    </section>
                </div>
            `;
        }

        function showYear(year) {
            document.querySelectorAll(".year-btn").forEach(button => {
                const isActive = button.dataset.year === year;
                button.classList.toggle("active", isActive);
                button.setAttribute("aria-selected", String(isActive));
            });
            document.getElementById("edition-content").innerHTML = renderEdition(year);
        }

        document.querySelectorAll(".year-btn").forEach(button => {
            button.addEventListener("click", () => showYear(button.dataset.year));
        });
        showYear("2026");

        const canvas = document.getElementById("network-canvas");
        const canvasContext = canvas.getContext("2d");
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let nodes = [];
        let canvasWidth = 0;
        let canvasHeight = 0;
        let pixelRatio = 1;

        function setupNetwork() {
            const bounds = canvas.getBoundingClientRect();
            canvasWidth = bounds.width;
            canvasHeight = bounds.height;
            pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = canvasWidth * pixelRatio;
            canvas.height = canvasHeight * pixelRatio;
            canvasContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            const count = Math.max(24, Math.min(48, Math.round(canvasWidth / 26)));
            nodes = Array.from({ length: count }, (_, index) => ({
                x: Math.random() * canvasWidth,
                y: Math.random() * canvasHeight,
                vx: (Math.random() - 0.5) * 0.18,
                vy: (Math.random() - 0.5) * 0.18,
                radius: index % 7 === 0 ? 2.8 : 1.6
            }));
            drawNetwork(0);
        }

        function drawNetwork(time) {
            canvasContext.clearRect(0, 0, canvasWidth, canvasHeight);
            for (let i = 0; i < nodes.length; i += 1) {
                const node = nodes[i];
                if (!reduceMotion) {
                    node.x += node.vx;
                    node.y += node.vy;
                    if (node.x < -20 || node.x > canvasWidth + 20) node.vx *= -1;
                    if (node.y < -20 || node.y > canvasHeight + 20) node.vy *= -1;
                }

                for (let j = i + 1; j < nodes.length; j += 1) {
                    const other = nodes[j];
                    const dx = node.x - other.x;
                    const dy = node.y - other.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance > 185) continue;
                    const opacity = (1 - distance / 185) * 0.32;
                    canvasContext.strokeStyle = `rgba(57, 208, 195, ${opacity})`;
                    canvasContext.lineWidth = 1;
                    canvasContext.beginPath();
                    canvasContext.moveTo(node.x, node.y);
                    canvasContext.lineTo(other.x, other.y);
                    canvasContext.stroke();

                    if (!reduceMotion && (i + j) % 5 === 0) {
                        const progress = (time * 0.000035 + (i + j) * 0.09) % 1;
                        const pulseX = node.x + (other.x - node.x) * progress;
                        const pulseY = node.y + (other.y - node.y) * progress;
                        canvasContext.fillStyle = "rgba(242, 166, 90, 0.88)";
                        canvasContext.beginPath();
                        canvasContext.arc(pulseX, pulseY, 2, 0, Math.PI * 2);
                        canvasContext.fill();
                    }
                }
            }

            nodes.forEach(node => {
                canvasContext.fillStyle = node.radius > 2 ? "rgba(242, 166, 90, 0.95)" : "rgba(127, 231, 224, 0.7)";
                canvasContext.beginPath();
                canvasContext.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                canvasContext.fill();
            });
        }

        function animateNetwork(time) {
            drawNetwork(time);
            if (!reduceMotion) window.requestAnimationFrame(animateNetwork);
        }

        setupNetwork();
        if (!reduceMotion) window.requestAnimationFrame(animateNetwork);
        window.addEventListener("resize", setupNetwork);
    </script>
